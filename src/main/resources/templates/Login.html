<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8" />
	<title>TEA : LOGIN</title>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
	<link rel="stylesheet" href="" th:href="@{/css/Navigation.css}" />
	<link rel="stylesheet" href="" th:href="@{/css/Login.css}" />
</head>

<body>
	<nav th:replace="~{Navigation::navbar()}">
	</nav>
	<div class="LoginContainer">
		<div class="admin">
			<div class="content">
				<strong style="font-size: 16px;margin-bottom: 0px;">BUSINESS</strong>
				<h2>For <span style="color:green;">Admins &amp; Users</span></h2>

				<form th:action="@{/login}" method="post">
					<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

					<b>Email :</b>
					<input type="email" name="email" placeholder="Enter email..." class="email" required> <br />

					<b> Password:</b>
					<input type="password" name="password" placeholder="Enter password" class="password" required> <br />

					<small style="color: red;" th:if="${param.error}">Invalid email or password</small>
					<small style="color: green;" th:if="${param.logout}">You have been logged out.</small><br />
					<button type="submit" class="loginButton">Log in</button>
				</form>
			</div>
		</div>
	</div>
</body>

</html>
