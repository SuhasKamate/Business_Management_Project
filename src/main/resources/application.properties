spring.application.name=BusinessProject

# Database — supply real values via environment variables (do not commit credentials)
spring.datasource.name=${DB_NAME:businessproject}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/businessproject}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Schema management: use validate in prod; update only for local dev
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

server.port=${SERVER_PORT:2330}
